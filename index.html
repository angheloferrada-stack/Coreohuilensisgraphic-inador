<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F7F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Escenario">
  <title>Escenario · Huilén</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <img src="logo.png" alt="Huilén" class="logo">
    <div class="brand">
      <strong>Escenario</strong>
      <span>Formaciones</span>
    </div>
    <div class="top-actions">
      <select id="choreoSelect" aria-label="Coreografía"></select>
      <button id="btnNewChoreo" class="pill" title="Nueva coreografía">+</button>
      <button id="btnRenameChoreo" class="pill" title="Renombrar">✎</button>
      <button id="btnDeleteChoreo" class="pill" title="Eliminar coreografía">🗑</button>
    </div>
  </header>

  <main>
    <div class="stage-wrap">
      <canvas id="stage"></canvas>
    </div>

    <section class="bar">
      <div class="transport">
        <button id="btnPrev" title="Formación anterior">⏮</button>
        <button id="btnPlay" class="primary" title="Reproducir">▶</button>
        <button id="btnNext" title="Formación siguiente">⏭</button>
        <span id="status" class="status"></span>
      </div>

      <div id="timeline" class="timeline" aria-label="Línea de tiempo"></div>

      <p class="eyebrow">Formaciones</p>
      <div class="row">
        <button id="btnAddFrame">+ Formación</button>
        <button id="btnDupFrame">Duplicar</button>
        <button id="btnDelFrame">Borrar</button>
        <button id="btnNotes">Nombre y notas</button>
      </div>

      <div class="row">
        <label>Tiempos al siguiente <input id="transBeats" type="number" min="1" max="64" value="8"></label>
        <label>BPM <input id="bpm" type="number" min="30" max="300" value="120"></label>
        <label><input id="curved" type="checkbox"> Curvas</label>
        <label><input id="snap" type="checkbox" checked> Grilla</label>
      </div>

      <p class="eyebrow">Rutas</p>
      <div class="row">
        <button id="btnToolRoute" title="Toca el escenario para añadir puntos de ruta a los seleccionados">Ruta</button>
        <button id="btnToolTurn" title="Toca el centro de giro para hacer dar vueltas a los seleccionados">Vuelta</button>
        <button id="btnUndoWp">Deshacer punto</button>
        <button id="btnClearRoutes">Borrar rutas</button>
      </div>

      <p class="eyebrow">Bailarines</p>
      <div class="row">
        <button id="btnAddDancer">+ Bailarín</button>
        <button id="btnRemoveDancer">− Seleccionados</button>
        <button id="btnCrews">Crews</button>
      </div>

      <p class="eyebrow">Música y exportar</p>
      <div class="row">
        <button id="btnMusic">🎵 Música</button>
        <span id="audioName" class="muted"></span>
        <input id="audioFile" type="file" accept="audio/*" hidden>
      </div>
      <div class="row">
        <button id="btnExportPng">PNG</button>
        <button id="btnExportVideo">Video</button>
        <button id="btnExportJson">JSON</button>
        <button id="btnImport">Importar</button>
        <button id="btnShare">Compartir</button>
      </div>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </section>
  </main>

  <dialog id="dlgNotes">
    <h3>Formación</h3>
    <input id="frameName" type="text" maxlength="30" placeholder="Nombre de la formación">
    <textarea id="notesText" rows="6" placeholder="Notas para los bailarines…"></textarea>
    <div class="row"><button data-close>Listo</button></div>
  </dialog>

  <dialog id="dlgCrews">
    <h3>Crews</h3>
    <div id="crewList"></div>
    <div class="row">
      <button id="btnCrewFromSel">Crear con seleccionados</button>
      <button id="btnCrewClear">Quitar de crew</button>
      <button data-close>Cerrar</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
